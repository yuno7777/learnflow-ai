name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The whole suite runs against the deterministic offline provider — CI never spends money
  # on a model call, and a provider outage can never turn the build red.
  LLM_PROVIDER: mock
  EMBEDDING_PROVIDER: mock

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check learnflow tests

      - name: Ruff (format check)
        run: ruff format --check learnflow tests

      - name: mypy
        run: mypy learnflow

      - name: pytest
        run: pytest -q --tb=short

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  integration:
    name: Integration (Postgres, Redis, real migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learnflow
          POSTGRES_PASSWORD: learnflow
          POSTGRES_DB: learnflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learnflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://learnflow:learnflow@localhost:5432/learnflow_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-value-long-enough-for-hs256
      WEBHOOK_SIGNING_SECRET: ci-webhook-secret-value
      CHROMA_PERSIST_DIR: /tmp/chroma
      UPLOAD_DIR: /tmp/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations against real Postgres
        run: alembic upgrade head

      - name: Verify the schema is reachable and seed loads
        run: |
          mkdir -p /tmp/uploads /tmp/chroma
          python -m learnflow.seed

      - name: Verify migrations are reversible
        run: alembic downgrade base

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (known CVEs in dependencies)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict -r <(python - <<'PY'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("apps/api/pyproject.toml").read_text())
          print("\n".join(data["project"]["dependencies"]))
          PY
          ) || echo "::warning::pip-audit reported findings"

      - name: Bandit (Python static analysis)
        run: |
          pip install bandit
          bandit -q -r apps/api/learnflow -ll

      - name: npm audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported findings"

      - name: Fail if a secret-looking literal was committed
        run: |
          # Catches the classic mistake: a real key pasted into a config file.
          if grep -rInE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})" \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.venv .; then
            echo "::error::A credential-shaped literal is committed"
            exit 1
          fi

  docker:
    name: Docker images and compose config
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose configuration is valid"

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: base
          push: false
          load: true
          tags: learnflow/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: worker
          push: false
          tags: learnflow/worker:ci
          cache-from: type=gha

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          tags: learnflow/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the API image
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:///./smoke.db \
            -e JWT_SECRET=smoke-secret-value-long-enough \
            learnflow/api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/openapi.json > /dev/null
          docker rm -f api-smoke

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests parse and match the generator
        run: |
          python scripts/build_k8s_manifests.py
          python scripts/build_n8n_workflows.py
          git diff --exit-code infrastructure/kubernetes automation/n8n-workflows \
            || (echo "::error::Generated files are out of date — run the scripts and commit"; exit 1)
      - name: kubectl dry-run
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          ./kubectl kustomize infrastructure/kubernetes > /dev/null
          echo "kustomize build succeeded"

  # Deployment is intentionally gated: it runs only when the deploy secrets exist.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker, integration, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check for deployment credentials
        id: creds
        run: |
          if [ -n "${{ secrets.REGISTRY_USERNAME }}" ] && [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment secrets are not configured — skipping deploy."
          fi
      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        run: echo "Push images and 'kubectl apply -k infrastructure/kubernetes' here."
