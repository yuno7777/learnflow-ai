name: Vector storage persistence
on: [pull_request, push]
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMA_HOST: 127.0.0.1
      CHROMA_PORT: "8001"
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: vector_ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c apps/api/constraints.txt ./apps/api
      - run: cp .env.example .env
      - run: docker compose up -d --wait chromadb
      - name: Store a training document chunk
        run: |
          python - <<'PY'
          import asyncio
          from uuid import UUID
          from learnflow.rag.vectorstore import ChromaVectorStore, VectorRecord
          record = VectorRecord(id="handbook:0", embedding=[1.0, 0.0], text="Training starts Monday.", metadata={"page": 3})
          asyncio.run(ChromaVectorStore().upsert(UUID(int=1), [record]))
          PY
      - run: docker compose up -d --force-recreate --wait chromadb
      - name: Verify persisted content and citation metadata
        run: |
          python - <<'PY'
          import asyncio
          from uuid import UUID
          from learnflow.rag.vectorstore import ChromaVectorStore

          async def verify():
              store = ChromaVectorStore()
              matches = await store.query(UUID(int=1), [1.0, 0.0], top_k=1)
              assert len(matches) == 1
              match = matches[0]
              assert (match.id, match.text, match.metadata["page"]) == ("handbook:0", "Training starts Monday.", 3)
              assert await store.count(UUID(int=2)) == 0

          asyncio.run(verify())
          PY
      - name: Rehearse copying persisted embeddings to PostgreSQL
        env:
          VECTOR_TEST_DSN: postgresql://postgres:vector_ci@localhost:5432/postgres
        run: python tests/vector_migration_smoke.py
      - name: Restore the vector backup into a fresh database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc postgres > "$RUNNER_TEMP/vector.dump"
          docker exec "$PG_CONTAINER" createdb -U postgres vector_restore
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres --exit-on-error --single-transaction -d vector_restore < "$RUNNER_TEMP/vector.dump"
          query="COPY (SELECT tenant, id, body, metadata, embedding FROM learnflow_vector.chunks ORDER BY tenant, id) TO STDOUT"
          for db in postgres vector_restore; do
            docker exec "$PG_CONTAINER" psql -Xq -v ON_ERROR_STOP=1 -U postgres -d "$db" -c "$query" > "$RUNNER_TEMP/$db.rows"
          done
          test -s "$RUNNER_TEMP/postgres.rows"
          cmp "$RUNNER_TEMP/postgres.rows" "$RUNNER_TEMP/vector_restore.rows"
      - if: failure()
        run: docker compose logs chromadb
