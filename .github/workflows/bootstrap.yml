name: Portable development bootstrap

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify local configuration setup
        run: python -m unittest discover -s tests -p test_dev_bootstrap.py -v
      - name: Validate the Compose stack
        if: runner.os == 'Linux'
        run: |
          python scripts/dev.py init
          python scripts/dev.py doctor
