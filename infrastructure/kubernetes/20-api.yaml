# Generated by scripts/build_k8s_manifests.py — edit that file, not this one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: learnflow-uploads
  namespace: learnflow
spec:
  # RWX so the API (which writes uploads) and the worker (which reads them) can share it.
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: learnflow-migrate
  namespace: learnflow
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: learnflow-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: learnflow/api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: learnflow-config
            - secretRef:
                name: learnflow-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: learnflow
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: learnflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        # Do not serve traffic against an un-migrated schema.
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - kubectl wait --for=condition=complete --timeout=300s job/learnflow-migrate
      containers:
        - name: api
          image: learnflow/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: learnflow-config
            - secretRef:
                name: learnflow-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: learnflow-uploads
