[project]
name = "learnflow-api"
version = "0.1.0"
description = "LearnFlow AI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
    "email-validator>=2.2",
    "sse-starlette>=2.1",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "structlog>=24.4",
    # Keep the HTTP client aligned with the Chroma server image in docker-compose.yml.
    "chromadb==0.5.20",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["learnflow*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends()/Query() in argument defaults is the framework idiom
    "UP042",  # str+Enum, not StrEnum: 3.11 is the floor and StrEnum lands only in 3.11+
]

[tool.mypy]
# 3.12 matches CI and the container image; the package floor stays 3.11.
python_version = "3.12"
plugins = []
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ['^\.venv/']

# chromadb drags numpy's stubs in transitively; we never touch numpy types ourselves.
[[tool.mypy.overrides]]
module = ["numpy.*", "chromadb.*", "arq.*", "sse_starlette.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
